name: Parakeet model test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install model dependencies
        run: python -m pip install ".[dev,parakeet]"
      - name: Download and verify model
        run: python scripts/download_models.py --target-dir models
      - name: Verify engine startup
        env:
          ASTERA_TRANSCRIBER_ENGINE: parakeet
          ASTERA_TRANSCRIBER_MODEL_PATH: models/parakeet-tdt-0.6b-v3-int8
        run: python -c "import asyncio; from astera_live_transcriber.infrastructure.config.settings import Settings; from astera_live_transcriber.infrastructure.engines.runtime import build_engine_runtime; r=build_engine_runtime(Settings()); asyncio.run(r.start()); print(r.public_status())"
