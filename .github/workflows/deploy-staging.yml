name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astera-live-transcriber-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy isolated Docker project
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          ssh -p "$STAGING_SSH_PORT" "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'
          set -eu

          app_dir=/opt/astera-live-transcriber-staging
          repo_url=https://github.com/HEINRICK7/astera-live-transcriber.git

          if [ ! -d "$app_dir/.git" ]; then
            git clone --branch main "$repo_url" "$app_dir"
          else
            git -C "$app_dir" fetch origin main
            git -C "$app_dir" checkout main
            git -C "$app_dir" reset --hard origin/main
          fi

          cat > "$app_dir/.env" <<'ENV'
          ASTERA_TRANSCRIBER_ENV=staging
          ASTERA_TRANSCRIBER_HOST=0.0.0.0
          ASTERA_TRANSCRIBER_PORT=8000
          ASTERA_TRANSCRIBER_HOST_PORT=48080
          ASTERA_TRANSCRIBER_LOG_LEVEL=INFO
          ASTERA_TRANSCRIBER_API_KEY=change-me
          ASTERA_TRANSCRIBER_DEFAULT_MODEL=astera-stt-1
          ASTERA_TRANSCRIBER_DEFAULT_LANGUAGE=pt-BR
          ASTERA_TRANSCRIBER_ENGINE=noop
          ASTERA_TRANSCRIBER_PARTIAL_INTERVAL_MS=1000
          ASTERA_TRANSCRIBER_AUDIO_MAX_SECONDS=3600
          ASTERA_TRANSCRIBER_AUDIO_RETENTION=false
          ENV
          chmod 600 "$app_dir/.env"

          cd "$app_dir"
          docker compose -p astera-live-transcriber-staging up -d --build --remove-orphans
          curl --fail --silent http://127.0.0.1:48080/health
          REMOTE
