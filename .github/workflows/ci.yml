name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Install FFmpeg for file-source tests
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

      - name: Compile sources
        run: python -m compileall -q src

      - name: Build Docker image
        run: docker build --tag astera-live-transcriber:ci .
